name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PichangaApp

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: PichangaApp/pom.xml

      - name: Dar permisos al wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: PichangaApp/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar jar
        uses: actions/upload-artifact@v4
        with:
          name: pichangaapp-jar
          path: PichangaApp/target/pichangaapp.jar
          retention-days: 7
          if-no-files-found: ignore
