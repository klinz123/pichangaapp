<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Notificaciones · PichangaApp</title>
</head>
<body>

<main id="contenido">
    <section class="seccion">
        <div class="contenedor">
            <div class="fila fila--entre encabezado-seccion">
                <div>
                    <span class="eyebrow">Tus notificaciones</span>
                    <h2>Notificaciones</h2>
                </div>
                <a class="boton boton--fantasma" th:href="@{/}">Volver al inicio</a>
            </div>

            <div class="tabla-responsive" th:if="${!#lists.isEmpty(notificaciones)}">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th style="text-align: left;">Fecha</th>
                        <th style="text-align: left;">Título</th>
                        <th style="text-align: left;">Mensaje</th>
                        <th style="text-align: left;">Estado</th>
                        <th style="text-align: left;">Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="n : ${notificaciones}"
                        th:classappend="${n.leida} ? '' : 'fila--no-leida'">
                        <td th:text="${n.fechaCreacion}">2026-10-24</td>
                        <td th:text="${n.titulo}">Título</td>
                        <td th:text="${n.contenido}">Mensaje</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${n.leida} ? 'badge--exito' : 'badge--warning'"
                                  th:text="${n.leida} ? 'Leída' : 'No leída'">No leída</span>
                        </td>
                        <td>
                            <form th:action="@{/notificaciones/{id}/leer(id=${n.id})}" method="post"
                                  th:if="${!n.leida}">
                                <button type="submit" class="boton boton--primario boton--pequeno">
                                    Marcar leída
                                </button>
                            </form>
                            <a th:unless="${!n.leida}" th:href="${n.enlace}" class="boton boton--fantasma boton--pequeno">Ver</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="sin-datos" th:if="${#lists.isEmpty(notificaciones)}">
                <svg class="svg-icon svg-icon--grande" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <p style="margin: 0;">No tienes notificaciones.</p>
            </div>
        </div>
    </section>
</main>

<style>
    .tabla-responsive { overflow-x: auto; margin-top: 1rem; }
    table.tabla { width: 100%; border-collapse: collapse; }
    table.tabla th, table.tabla td {
        padding: .75rem 1rem;
        text-align: left;
        border-bottom: 1px solid var(--pa-borde);
    }
    table.tabla th { background: var(--pa-superficie-2); font-size: var(--pa-pequeno); text-transform: uppercase; letter-spacing: .05em; color: var(--pa-texto-tenue); }
    table.tabla tr:hover { background: var(--pa-superficie-2); }
    .fila--no-leida { background: var(--pa-primary-suave-2); }
    .badge {
        display: inline-flex;
        align-items: center;
        padding: .25rem .6rem;
        border-radius: var(--pa-radio-pill);
        font-size: var(--pa-micro);
        font-weight: 600;
    }
    .badge--exito { background: var(--pa-exito-suave); color: var(--pa-exito); }
    .badge--warning { background: var(--pa-advertencia-suave); color: var(--pa-advertencia); }
</style>

</body>
</html>
