<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Usuarios · PichangaApp</title>
</head>
<body>

<main id="contenido">
    <section class="seccion">
        <div class="contenedor">
            <div class="fila fila--entre encabezado-seccion">
                <div>
                    <span class="eyebrow">Gestión de usuarios</span>
                    <h2>Usuarios registrados</h2>
                </div>
                <a class="boton boton--fantasma" th:href="@{/admin}">Volver al panel admin</a>
            </div>

            <div class="tabla-responsive" th:if="${!#lists.isEmpty(usuarios)}">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th style="text-align: left;">Nombre</th>
                        <th style="text-align: left;">Correo</th>
                        <th style="text-align: left;">Rol</th>
                        <th style="text-align: left;">Estado</th>
                        <th style="text-align: left;">Verificado</th>
                        <th style="text-align: left;">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.nombre}">Usuario</td>
                        <td th:text="${u.email}">correo@ejemplo.com</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.rol.name() == 'ADMIN'} ? 'badge--danger' : 'badge--info'"
                                  th:text="${u.rol.etiqueta}">Jugador</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.activo} ? 'badge--exito' : 'badge--secondary'"
                                  th:text="${u.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.verificado} ? 'badge--exito' : 'badge--secondary'"
                                  th:text="${u.verificado} ? 'Verificado' : 'No verificado'">No verificado</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}" method="post"
                                  th:unless="${#authentication.principal.id == u.id}"
                                  data-confirmar="¿Cambiar el estado de este usuario?">
                                <input type="hidden" name="activo" th:value="${!u.activo}"/>
                                <button type="submit" class="boton boton--fantasma boton--pequeno"
                                        th:text="${u.activo} ? 'Desactivar' : 'Activar'"></button>
                            </form>
                            <span th:if="${#authentication.principal.id == u.id}"
                                  class="texto-pequeno texto-tenue">(tu cuenta)</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="sin-datos" th:if="${#lists.isEmpty(usuarios)}">
                <p style="margin: 0;">No hay usuarios registrados.</p>
            </div>
        </div>
    </section>
</main>

<style>
    .tabla-responsive { overflow-x: auto; margin-top: 1rem; }
    table.tabla { width: 100%; border-collapse: collapse; }
    table.tabla th, table.tabla td {
        padding: .75rem 1rem;
        text-align: left;
        border-bottom: 1px solid var(--pa-borde);
    }
    table.tabla th { background: var(--pa-superficie-2); font-size: var(--pa-pequeno); text-transform: uppercase; letter-spacing: .05em; color: var(--pa-texto-tenue); }
    table.tabla tr:hover { background: var(--pa-superficie-2); }
    .badge {
        display: inline-flex;
        align-items: center;
        padding: .25rem .6rem;
        border-radius: var(--pa-radio-pill);
        font-size: var(--pa-micro);
        font-weight: 600;
    }
    .badge--exito { background: var(--pa-exito-suave); color: var(--pa-exito); }
    .badge--danger { background: var(--pa-peligro-suave); color: var(--pa-peligro); }
    .badge--info { background: var(--pa-info-suave); color: var(--pa-info); }
    .badge--secondary { background: #f1f5f9; color: var(--pa-texto-tenue); }
</style>

</body>
</html>
