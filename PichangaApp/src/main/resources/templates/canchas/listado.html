<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Canchas disponibles · PichangaApp</title>
</head>
<body>

<main id="contenido">
    <section class="seccion">
        <div class="contenedor">
            <div class="fila fila--entre encabezado-seccion">
                <div>
                    <span class="eyebrow">Explorar canchas</span>
                    <h2>Canchas disponibles</h2>
                    <p class="texto-suave" style="margin: 0;">
                        Encuentra la cancha ideal por distrito, superficie y precio.
                    </p>
                </div>
                <a class="boton boton--primario" th:href="@{/}">Volver al inicio</a>
            </div>

            <!-- Filtros de busqueda -->
            <form class="filtros tarjeta" th:action="@{/canchas}" method="get">
                <div class="fila fila--entre fila--ajustar" style="gap: 1rem;">
                    <div class="campo">
                        <label class="campo__etiqueta">Distrito</label>
                        <select name="distrito" class="control">
                            <option value="">Todos los distritos</option>
                            <option th:each="d : ${distritos}"
                                    th:value="${d}"
                                    th:text="${d}"></option>
                        </select>
                    </div>
                    <div class="campo">
                        <label class="campo__etiqueta">Fecha</label>
                        <input type="date" name="fecha" class="control"
                               th:value="${filtros.fecha != null ? #temporals.format(filtros.fecha, 'yyyy-MM-dd') : ''}"/>
                    </div>
                    <div class="campo">
                        <label class="campo__etiqueta">Hora</label>
                        <input type="time" name="hora" class="control"
                               th:value="${filtros.hora != null ? #temporals.format(filtros.hora, 'HH:mm') : ''}"/>
                    </div>
                    <button type="submit" class="boton boton--primario">Buscar</button>
                    <a class="boton boton--fantasma" th:href="@{/canchas}">Limpiar filtros</a>
                </div>
            </form>

            <!-- Resultados -->
            <div class="fila fila--entre" style="margin-top: 1.5rem;">
                <span class="texto-pequeno texto-tenue"
                      th:text="|${total} cancha${total != 1 ? 's' : ''} encontrada${total != 1 ? 's' : ''}|"></span>
            </div>

            <div class="rejilla rejilla--2" th:if="${!#lists.isEmpty(tarjetas)}">
                <th:block th:each="tarjeta : ${tarjetas}">
                    <article th:replace="~{layout/base :: tarjetaCancha(${tarjeta})}"></article>
                </th:block>
            </div>

            <div class="sin-datos" th:if="${#lists.isEmpty(tarjetas)}">
                <i class="bi bi-dribbble sin-datos__icono" aria-hidden="true"></i>
                <p style="margin: 0;">No hay canchas disponibles con esos filtros. Intenta con otra fecha o distrito.</p>
            </div>
        </div>
    </section>
</main>

</body>
</html>
