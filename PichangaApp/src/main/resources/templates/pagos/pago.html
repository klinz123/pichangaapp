<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Pago de reserva · PichangaApp</title>
</head>
<body>

<main id="contenido">
    <section class="seccion">
        <div class="contenedor">
            <div class="fila fila--entre" style="margin-bottom: 1.5rem;">
                <a class="boton boton--fantasma boton--pequeno" th:href="@{/reservas/mis-reservas}">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver a mis reservas
                </a>
                <span class="texto-pequeno texto-tenue" th:text="|Reserva ${reserva.codigo}|"></span>
            </div>

            <div class="tarjeta">
                <h3 style="margin-top: 0;">Completar el pago</h3>
                <p class="texto-suave">
                    Reserva <strong th:text="${reserva.codigo}">PIC-XXXX</strong> para
                    <strong th:text="${reserva.cancha.nombre}">Cancha</strong>,
                    el <span th:text="${reserva.fecha}">fecha</span> a las
                    <span th:text="${reserva.horaInicio}">hora</span>.
                </p>

                <div class="fila fila--entre" style="margin-top: 1.5rem;">
                    <span>Monto a pagar:</span>
                    <span style="font-size: 1.75rem; font-weight: bold;">
                        <span th:replace="~{layout/base :: precio(${reserva.precioTotal})}">S/ 80</span>
                    </span>
                </div>

                <div class="alerta alerta--aviso" role="status" style="margin-top: 1.5rem;">
                    <i class="bi bi-clock" aria-hidden="true"></i>
                    <span>
                        Tienes 15 minutos para completar el pago. Despues, la reserva expirara y el horario se liberara.
                    </span>
                </div>

                <form th:action="@{/pagos/procesar}" method="post">
                    <input type="hidden" name="reservaId" th:value="${reserva.id}"/>

                    <div class="fila fila--entre fila--ajustar" style="margin-top: 1.5rem; gap: 1rem; flex-wrap: wrap;">
                        <th:block th:each="metodo : ${metodos}">
                            <label class="metodo-pago"
                                   style="display: block; border: 1px solid var(--pa-borde); border-radius: var(--pa-radio); padding: 1rem; cursor: pointer; transition: all .15s ease; text-align: left;">
                                <input type="radio" name="metodo" th:value="${metodo}"
                                       th:checked="${metodo == metodos[0]}" required
                                       style="margin: 0;"/>
                                <div class="fila" style="gap: .75rem; align-items: center;">
                                    <div class="metodo-pago__icono"
                                           style="font-size: 1.75rem; width: 3rem;">
                                        <i class="bi" th:classappend="${metodo.icono}"></i>
                                    </div>
                                    <div class="metodo-pago__texto">
                                        <strong th:text="${metodo.etiqueta}">Yape</strong>
                                        <p class="texto-pequeno texto-tenue" style="margin: .25rem 0 0;"
                                             th:text="${metodo.descripcion}">Pago con QR</p>
                                    </div>
                                </div>
                            </label>
                        </th:block>
                    </div>

                    <div class="campo" style="margin-top: 1rem;">
                        <label class="campo__etiqueta">Referencia o numero de transaccion (opcional)</label>
                        <input type="text" name="referencia" class="control"
                               placeholder="Ej: Yape 123456789"/>
                    </div>

                    <button type="submit" class="boton boton--primario boton--grande"
                            style="margin-top: 1.5rem; width: 100%;">
                        Confirmar pago y reservar
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>

<style>
    .metodo-pago:hover { border-color: var(--pa-verde-500); background: var(--pa-verde-50); }
    .metodo-pago:has(input:checked) { border-color: var(--pa-verde-600); background: var(--pa-verde-50); }
    .metodo-pago__icono i { color: var(--pa-verde-600); }
</style>

</body>
</html>
