<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Mis canchas · PichangaApp</title>
</head>
<body>

<main id="contenido">
    <section class="seccion">
        <div class="contenedor">
            <div class="fila fila--entre encabezado-seccion">
                <div>
                    <span class="eyebrow">Gestión de canchas</span>
                    <h2>Mis canchas</h2>
                </div>
                <a class="boton boton--primario" th:href="@{/panel/canchas/nueva}">
                    <i class="bi bi-plus-lg" aria-hidden="true"></i> Nueva cancha
                </a>
                <a class="boton boton--fantasma" th:href="@{/panel}">Volver al panel</a>
            </div>

            <div class="tabla-responsive" th:if="${!#lists.isEmpty(canchas)}">
                <table class="tabla">
                    <thead>
                    <tr>
                        <th style="text-align: left;">Nombre</th>
                        <th style="text-align: left;">Ubicación</th>
                        <th style="text-align: left;">Superficie</th>
                        <th style="text-align: left;">Precio/hora</th>
                        <th style="text-align: left;">Estado</th>
                        <th style="text-align: left;">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${canchas}">
                        <td th:text="${c.nombre}">Cancha</td>
                        <td th:text="${c.ubicacion}">Dirección</td>
                        <td th:text="${c.superficie.etiqueta}">Síntético</td>
                        <td><span th:replace="~{layout/base :: precio(${c.precioHora})}">S/ 80</span></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${c.activa} ? 'badge--exito' : 'badge--secondary'"
                                  th:text="${c.activa} ? 'Activa' : 'Inactiva'">Activa</span>
                        </td>
                        <td>
                            <div class="fila" style="gap: .5rem;">
                                <a class="boton boton--primario boton--pequeno"
                                   th:href="@{/panel/canchas/{id}/horarios(id=${c.id})}">
                                    Horarios
                                </a>
                                <a class="boton boton--fantasma boton--pequeno"
                                   th:href="@{/panel/canchas/{id}/editar(id=${c.id})}">
                                    Editar
                                </a>
                                <form th:action="@{/panel/canchas/{id}/estado(id=${c.id})}" method="post"
                                      style="display: inline;"
                                      data-confirmar="¿Cambiar el estado de esta cancha?">
                                    <input type="hidden" name="activa"
                                           th:value="${!c.activa}"/>
                                    <button type="submit" class="boton boton--fantasma boton--pequeno"
                                            th:text="${c.activa} ? 'Desactivar' : 'Activar'"></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="sin-datos" th:if="${#lists.isEmpty(canchas)}">
                <i class="bi bi-building sin-datos__icono" aria-hidden="true"></i>
                <p style="margin: 0;">No tienes canchas registradas.</p>
                <a class="boton boton--primario" th:href="@{/panel/canchas/nueva}"
                   style="margin-top: 1rem; display: inline-block;">Registrar cancha</a>
            </div>
        </div>
    </section>
</main>

<style>
    .tabla-responsive { overflow-x: auto; margin-top: 1rem; }
    table.tabla { width: 100%; border-collapse: collapse; }
    table.tabla th, table.tabla td {
        padding: .75rem 1rem;
        text-align: left;
        border-bottom: 1px solid var(--pa-borde);
    }
    table.tabla th { background: var(--pa-superficie-2); font-size: var(--pa-pequeno); text-transform: uppercase; letter-spacing: .05em; color: var(--pa-texto-tenue); }
    table.tabla tr:hover { background: var(--pa-superficie-2); }
    .badge {
        display: inline-flex;
        align-items: center;
        padding: .25rem .6rem;
        border-radius: var(--pa-radio-pill);
        font-size: var(--pa-micro);
        font-weight: 600;
    }
    .badge--exito { background: var(--pa-exito-suave); color: var(--pa-exito); }
    .badge--secondary { background: #f1f5f9; color: var(--pa-texto-tenue); }
</style>

</body>
</html>
