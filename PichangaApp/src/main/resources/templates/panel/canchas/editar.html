<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: pagina(~{::title}, ~{::main})}">
<head>
    <title th:text="|Editar ${cancha.nombre} · PichangaApp|">Editar cancha · PichangaApp</title>
</head>
<body>

<main id="contenido">
    <section class="seccion">
        <div class="contenedor">
            <div class="fila fila--entre" style="margin-bottom: 1.5rem;">
                <a class="boton boton--fantasma boton--pequeno" th:href="@{/panel/canchas}">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i> Volver a mis canchas
                </a>
            </div>

            <div class="tarjeta">
                <h3 style="margin-top: 0;">Editar cancha</h3>
                <p class="texto-suave" style="margin-bottom: 1.5rem;" th:text="|Modifica los datos de ${cancha.nombre}|">Editar cancha</p>

                <form th:action="@{/panel/canchas/{id}(id=${cancha.id})}" method="post">
                    <div class="fila fila--entre fila--ajustar" style="gap: 1rem; margin-bottom: 1rem;">
                        <div class="campo" style="flex: 1;">
                            <label class="campo__etiqueta">Nombre del complejo</label>
                            <input type="text" name="nombre" class="control" required
                                   th:value="${canchaForm.nombre != null ? canchaForm.nombre : cancha.nombre}"/>
                        </div>
                        <div class="campo" style="flex: 1;">
                            <label class="campo__etiqueta">Distrito</label>
                            <select name="distrito" class="control" required>
                                <option value="">Selecciona un distrito</option>
                                <option th:each="d : ${distritos}"
                                        th:value="${d}"
                                        th:text="${d}"
                                        th:selected="${cancha.distrito == d}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="campo" style="margin-bottom: 1rem;">
                        <label class="campo__etiqueta">Dirección</label>
                        <input type="text" name="direccion" class="control" required
                               th:value="${canchaForm.direccion != null ? canchaForm.direccion : cancha.direccion}"/>
                    </div>

                    <div class="fila fila--entre fila--ajustar" style="gap: 1rem; margin-bottom: 1rem;">
                        <div class="campo" style="flex: 1;">
                            <label class="campo__etiqueta">Superficie</label>
                            <select name="superficie" class="control" required>
                                <option value="">Selecciona superficie</option>
                                <option th:each="s : ${superficies}"
                                        th:value="${s}"
                                        th:text="${s.etiqueta}"
                                        th:selected="${cancha.superficie == s}"></option>
                            </select>
                        </div>
                        <div class="campo" style="flex: 1;">
                            <label class="campo__etiqueta">Capacidad (jugadores)</label>
                            <input type="number" name="capacidad" class="control" required
                                   th:value="${canchaForm.capacidad != null ? canchaForm.capacidad : cancha.capacidad}"
                                   min="4" max="30"/>
                        </div>
                    </div>

                    <div class="fila fila--entre fila--ajustar" style="gap: 1rem; margin-bottom: 1rem;">
                        <div class="campo" style="flex: 1;">
                            <label class="campo__etiqueta">Precio por hora (S/)</label>
                            <input type="number" name="precioHora" class="control" required
                                   th:value="${canchaForm.precioHora != null ? canchaForm.precioHora : cancha.precioHora}"
                                   min="0.01" step="0.01"/>
                        </div>
                        <div class="campo" style="flex: 1;">
                            <label class="campo__etiqueta">Hora de apertura</label>
                            <input type="time" name="horaApertura" class="control" required
                                   th:value="${canchaForm.horaApertura != null ? #temporals.format(canchaForm.horaApertura, 'HH:mm') : #temporals.format(cancha.horaApertura, 'HH:mm')}"/>
                        </div>
                        <div class="campo" style="flex: 1;">
                            <label class="campo__etiqueta">Hora de cierre</label>
                            <input type="time" name="horaCierre" class="control" required
                                   th:value="${canchaForm.horaCierre != null ? #temporals.format(canchaForm.horaCierre, 'HH:mm') : #temporals.format(cancha.horaCierre, 'HH:mm')}"/>
                        </div>
                    </div>

                    <div class="campo" style="margin-bottom: 1rem;">
                        <label class="campo__etiqueta">Descripción</label>
                        <textarea name="descripcion" class="control"
                                  th:text="${canchaForm.descripcion != null ? canchaForm.descripcion : cancha.descripcion}"></textarea>
                    </div>

                    <div class="grupo-check" style="margin-bottom: 1rem;">
                        <input type="checkbox" name="activa" value="true" id="activa"
                               th:checked="${canchaForm.activa != null ? canchaForm.activa : cancha.activa}"/>
                        <label for="activa" style="margin: 0; font-weight: 600;">Cancha activa (visible para reservas)</label>
                    </div>

                    <button type="submit" class="boton boton--primario boton--grande" style="width: 100%;">
                        Guardar cambios
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>

</body>
</html>
