spring:
  application:
    name: PichangaApp
  config:
    import:
      - optional:file:./application-local.yml
      - optional:file:./PichangaApp/application-local.yml
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=PichangaApp;encrypt=true;trustServerCertificate=true;loginTimeout=8}
    username: ${DB_USER:pichanga_app}
    # La contrasena local vive en application-local.yml (ignorado por Git).
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: PichangaPool
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        jdbc:
          time_zone: America/Lima
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
      continue-on-error: false
  thymeleaf:
    cache: false
    encoding: UTF-8
  web:
    resources:
      cache:
        period: 0
  messages:
    basename: messages
    encoding: UTF-8

server:
  port: ${PORT:8081}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  compression:
    enabled: true

app:
  nombre: PichangaApp
  correo-soporte: soporte@pichangaapp.pe
  moneda: PEN
  zona-horaria: America/Lima
  reserva:
    minutos-expiracion: 15
    horas-minimas-cancelacion: 2
    porcentaje-reembolso: 80
    horas-anticipacion-maxima: 60
  pichanga:
    horas-minimas-cancelacion: 2
  seguridad:
    intentos-maximos: 5
    minutos-bloqueo: 15
  demo:
    seed: true

logging:
  config: classpath:logback-spring.xml
